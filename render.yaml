# Render Blueprint for the Plan Yukta pilot.
# New > Blueprint > pick this repo. Starts on Render's free instance (no charge):
# it sleeps after 15 minutes without visitors and takes about a minute to wake.
# For an always-on pilot change 'plan: free' to 'plan: 0.5c-512mb' (US$7/month),
# or upgrade the instance type in the Render dashboard.
services:
  - type: web
    name: plan-yukta-pilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: SECRET_KEY        # signs tester sessions; Render generates it
        generateValue: true
      - key: PILOT_ACCESS      # invited testers as name:code pairs, e.g. ravi:K7q2Lm,anita:P9xwT3
        sync: false
      - key: FEEDBACK_URL      # optional: link to a feedback form, shown in the header
        sync: false
      - key: ANTHROPIC_API_KEY # turns on the Ask Yukta chatbot (landing page) and the AI help chat; without it both use help search
        sync: false
      - key: CHAT_MODEL        # model used when ANTHROPIC_API_KEY is set
        value: claude-haiku-5-5
      - key: CHAT_DAILY_LIMIT  # Claude answers per user per day (both chats together)
        value: "10"
      - key: CHAT_GLOBAL_DAILY_LIMIT # whole-site cap per day, a hard ceiling on the API bill
        value: "200"
      - key: CHAT_UNLIMITED    # optional: tester names not limited per day (still inside the site cap), e.g. srini
        sync: false
      - key: CHAT_TZ_OFFSET_MIN # day rolls over at midnight in this offset from UTC (330 = IST)
        value: "330"
